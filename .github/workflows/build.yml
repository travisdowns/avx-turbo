name: build
on: [push, pull_request]
jobs:
  build:
    # Pushes cover branches in this repo; fork PRs never fire our push
    # trigger, so they are the only pull_request events worth building.
    if: >-
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, ubuntu-26.04]
    steps:
      - uses: actions/checkout@v7
      - run: lscpu
      - run: make -j2
      - run: ./unit-test
      - run: ./avx-turbo --no-pin --max-threads 2

  asan:
    # gated as the build job above is
    if: >-
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: make ASAN=1
      # avx-turbo itself is not leak-clean, and the unit tests are what
      # exercise the code paths sanitizers have something to say about
      - run: ./unit-test
